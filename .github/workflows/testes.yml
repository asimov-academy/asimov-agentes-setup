# O instalador não tem código da aplicação para testar: aqui roda o shellcheck e as simulações do
# onboarding e da atualização, com rede, DNS, Docker e API de mentira.
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Shellcheck
        run: |
          uvx --from shellcheck-py shellcheck -x -P SCRIPTDIR \
            install.sh setup/instalar.sh setup/asimov.sh setup/lib/*.sh deploy/*.sh setup/testes/simula_retomada.sh setup/testes/caddy_real.sh setup/testes/simula_contexto.sh \
            setup/testes/simula_desinstalar.sh setup/testes/simula_assinatura.sh setup/testes/simula_evolucao.sh
      - name: Contexto na instalação e atualização
        run: bash setup/testes/simula_contexto.sh
      - name: Onboarding simulado
        run: ASIMOV_TTY=setup/testes/respostas.txt bash setup/testes/simula_onboarding.sh
      - name: Atualização simulada, com volta de versão
        run: bash setup/testes/simula_atualizacao.sh
      - name: Retomada, portas ocupadas e preservação do proxy
        run: bash setup/testes/simula_retomada.sh
      - name: Desinstalação, só do que é do Asimov
        run: bash setup/testes/simula_desinstalar.sh
      - name: Agente pela assinatura no terminal
        run: bash setup/testes/simula_assinatura.sh
      - name: Evolução de agente pelo assistente de código
        run: bash setup/testes/simula_evolucao.sh
      - name: Queda de conexão e reconexão real em tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          python3 setup/testes/test_sessao.py
      - name: Gateway com Caddy real
        run: bash setup/testes/caddy_real.sh
      - name: Nada de código da aplicação
        run: |
          for pasta in backend frontend spec painel .claude; do
            [ ! -e "$pasta" ] || { echo "$pasta não pode existir neste repositório"; exit 1; }
          done
          ! grep -rn "build:" deploy/docker-compose.yml
